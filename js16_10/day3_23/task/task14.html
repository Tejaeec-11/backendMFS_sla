
<!DOCTYPE html>
<html>
<head>
    <title>Task 14</title>
</head>
<body>
    <h2>Product Data Processor</h2>

    <script>
        const product = {
            name: "Laptop",
            price: 60000,
            category: "Electronics"
        };

        const getProductInfo = ({ name, price, category }) => {
            return `Product: ${name}
Price: ₹${price}
Category: ${category}`;
        };

        console.log(getProductInfo(product));

        const updatedProduct = {
            ...product,
            price: 65000
        };

        console.log(getProductInfo(updatedProduct));

        console.log("Original price:", product.price);
    </script>
</body>
</html>
