
<!DOCTYPE html>
<html>
<head>
    <title>Template literals</title>
</head>
<body>
    <h2>User Profile Message</h2>

    <script>
        const name = "Bala";
        const age = 25;
        const city = "Chennai";
        const role = "Frontend Developer";

        const message = `Hello, my name is ${name}.
I am ${age} years old.
I live in ${city}.
I am a ${role}.`;

        console.log(message);
    </script>
    <!--Template literals use backticks and ${} to insert variables directly into a string. They also support multiline text without joining everything using +.-->
</body>
</html>
