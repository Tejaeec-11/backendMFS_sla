
<!DOCTYPE html>
<html>
<head>
    <title>default para & argu undefined</title>
</head>
<body>
    <h2>User Greeting</h2>

    <script>
        const greetUser = (name, role = "Developer") => {
            return `Hello ${name}, you are a ${role}.`;
        };

        console.log(greetUser("Bala", "Frontend Developer"));
        console.log(greetUser("Bala"));
    </script>
