
<!DOCTYPE html>
<html>
<head>
    <title>?. (optional chaining) ?? (nullish coalescing)</title>
</head>
<body>
    <h2>Safe User Profile</h2>

    <script>
        const user = {
            name: "Bala",
            age: 25
        };

        const getCity = () => {
            return user.address?.city ?? "Unknown City";
        };

        console.log(getCity());

        user.address = {
            city: "Chennai"
        };

        console.log(getCity());
    </script>
</body>
</html>
