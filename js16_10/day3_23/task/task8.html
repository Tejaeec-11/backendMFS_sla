
<!DOCTYPE html>
<html>
<head>
    <title>rest parameter ...</title>
</head>
<body>
    <h2>Shopping Cart Total</h2>

    <script>
        const calculateTotal = (...prices) => {
            let total = 0;

            for (const price of prices) {
                total = total + price;
            }

            return total;
        };

        console.log(calculateTotal(100, 200, 300));
        console.log(calculateTotal(50, 100));
        console.log(calculateTotal(100, 200, 300, 400));
    </script>
</body>
</html>
