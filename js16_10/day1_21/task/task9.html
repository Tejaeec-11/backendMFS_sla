<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Balance</title>
</head>
<body>
    <script>
        let balance = 1000;
let price = 300;

if (balance >= price) {
    console.log("Purchase successful");
    balance -= price;
    console.log("Remaining balance: " + balance);
} else {
    console.log("Insufficient balance");
}
    </script>
</body>
</html>
